name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat & SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint WorkoutTracker

      - name: SwiftLint
        run: swiftlint lint --config WorkoutTracker/.swiftlint.yml --strict

  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner's default-selected Xcode may not be the newest one
      # installed on the image, and may not carry a simulator runtime for
      # this project's deployment target. Switch to the newest available
      # Xcode rather than relying on the default.
      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -switch "$LATEST"
          xcodebuild -version
          # A freshly-selected Xcode needs its first-launch setup run once
          # (license acceptance, CoreSimulator/platform registration) or
          # later simctl/xcodebuild simulator calls fail with errors like
          # "Unable to connect to simulator".
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WorkoutTracker/WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker

      # The selected Xcode may not have the iOS Simulator platform runtime
      # downloaded yet (some runner images only ship other platforms, e.g.
      # visionOS, by default).
      - name: Ensure iOS Simulator platform is installed
        run: xcodebuild -downloadPlatform iOS

      # Query xcodebuild directly for a destination it considers valid for
      # this scheme, rather than picking a raw `simctl` device — a device
      # can be "available" per simctl while still belonging to a runtime
      # the active Xcode doesn't recognize for the scheme's platforms.
      - name: Determine simulator destination
        id: sim
        run: |
          UDID=$(xcodebuild -showdestinations \
              -project WorkoutTracker/WorkoutTracker.xcodeproj \
              -scheme WorkoutTracker \
            | grep 'platform:iOS Simulator' \
            | grep -v 'placeholder' \
            | sed -E 's/.*id:([0-9A-F-]+).*/\1/' \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::No buildable iOS Simulator destination found for this scheme."
            xcodebuild -showdestinations \
              -project WorkoutTracker/WorkoutTracker.xcodeproj \
              -scheme WorkoutTracker
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project WorkoutTracker/WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:WorkoutTrackerUITests/WorkoutTrackerUITestsLaunchTests
