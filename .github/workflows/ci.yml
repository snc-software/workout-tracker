name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat & SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint WorkoutTracker

      - name: SwiftLint
        run: swiftlint lint --config WorkoutTracker/.swiftlint.yml --strict

  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner's default-selected Xcode may not be the newest one
      # installed on the image, and may not carry a simulator runtime for
      # this project's deployment target. Switch to the newest available
      # Xcode rather than relying on the default.
      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -switch "$LATEST"
          xcodebuild -version
          # A freshly-selected Xcode needs its first-launch setup run once
          # (license acceptance, CoreSimulator/platform registration) or
          # later simctl/xcodebuild simulator calls fail with errors like
          # "Unable to connect to simulator".
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WorkoutTracker/WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker

      # The selected Xcode may not have the iOS Simulator platform runtime
      # downloaded yet (some runner images only ship other platforms, e.g.
      # visionOS, by default). Cached across runs since this download is
      # multiple GB and otherwise repeats on every job.
      - name: Cache iOS Simulator runtime
        uses: actions/cache@v4
        with:
          path: |
            /Library/Developer/CoreSimulator/Images
            /Library/Developer/CoreSimulator/Profiles/Runtimes
          key: ios-simulator-runtime-${{ runner.os }}-xcode-${{ hashFiles('/Applications/Xcode*.app/Contents/version.plist') }}

      - name: Ensure iOS Simulator platform is installed
        run: xcodebuild -downloadPlatform iOS

      # Downloading the platform only makes the runtime available; it does
      # not create a simulator device using it. Reuse one if a prior step
      # (or the cache) already left one, otherwise create one explicitly.
      - name: Determine simulator destination
        id: sim
        run: |
          find_destination() {
            xcodebuild -showdestinations \
                -project WorkoutTracker/WorkoutTracker.xcodeproj \
                -scheme WorkoutTracker \
              | grep 'platform:iOS Simulator' \
              | grep -v 'placeholder' \
              | sed -E 's/.*id:([0-9A-F-]+).*/\1/' \
              | head -1
          }

          UDID=$(find_destination)

          if [ -z "$UDID" ]; then
            echo "No existing iOS Simulator destination; creating one."
            RUNTIME_ID=$(xcrun simctl list runtimes available \
              | grep -m1 '^iOS' \
              | awk -F' - ' '{print $NF}')
            DEVICE_TYPE_ID=$(xcrun simctl list devicetypes \
              | grep -m1 'iPhone' \
              | sed -E 's/.*\(([^()]+)\)$/\1/')
            if [ -z "$RUNTIME_ID" ] || [ -z "$DEVICE_TYPE_ID" ]; then
              echo "::error::Could not resolve an iOS runtime and/or iPhone device type to create a simulator from."
              xcrun simctl list runtimes
              xcrun simctl list devicetypes
              exit 1
            fi
            echo "Creating simulator: device type $DEVICE_TYPE_ID, runtime $RUNTIME_ID"
            xcrun simctl create "CI iPhone" "$DEVICE_TYPE_ID" "$RUNTIME_ID"
            UDID=$(find_destination)
          fi

          if [ -z "$UDID" ]; then
            echo "::error::No buildable iOS Simulator destination found for this scheme, even after creating one."
            xcodebuild -showdestinations \
              -project WorkoutTracker/WorkoutTracker.xcodeproj \
              -scheme WorkoutTracker
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project WorkoutTracker/WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:WorkoutTrackerUITests/WorkoutTrackerUITestsLaunchTests
